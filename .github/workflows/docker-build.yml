# Build the DSH sandbox images and push them to the GitHub Container Registry as
# ghcr.io/langbeck/dsh.
#
# Pushes are limited to release tags so the tags consumers pin against only
# move when a release is cut, not on every commit. Pushes to main and pull
# requests build both images without pushing, which catches a broken Dockerfile
# before it reaches a tag.
#
#   push tag v1.2.3  -> ghcr.io/langbeck/dsh:base, :golang, :v1.2.3, :1.2.3,
#                       :1.2, :latest
#   push to main     -> build only, no tag, no push
#   pull request     -> build only, no tag, no push
#   manual dispatch  -> build only, no tag, no push; set `push` to publish the
#                       images under the release tags of the dispatched ref,
#                       which is how a failed release is retried
#
# No repository secrets are needed: GHCR authenticates with the per-run
# GITHUB_TOKEN, which is scoped to this repository and expires with the job, so
# there is no long-lived credential to leak or rotate.
#
# One-time setup after the first successful push: the package is created private,
# and public images are what allow anonymous pulls. Flip it under
# https://github.com/users/langbeck/packages/container/dsh/settings ->
# "Change visibility" -> Public. This cannot be undone.
#
# The Go image is built FROM the base image this same run produces, not from the
# registry, so the two images never drift apart and no registry round-trip is
# needed. See BASE_IMAGE in docker/golang.dockerfile.

name: docker-build

on:
  push:
    # Any branch or release tag reaches the job, and the job then decides
    # whether to build. `paths` cannot be used here: under `push` it gates tag
    # pushes as well as branch pushes, and a release must build even when its
    # commit happens to touch no image input. The `tags` pattern still limits
    # which tags trigger at all; the gate below only decides whether a branch
    # push is worth building.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: ["**"]
  pull_request:
    # A pull request is only ever validating the images, so it can be filtered
    # here with no such conflict.
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      # Named `publish` rather than `push`: `push` shadows the on.push event name,
      # which made `... || inputs.push` read as if it were a boolean when it
      # evaluates to a string.
      publish:
        description: Push the built images to the GitHub Container Registry
        type: boolean
        default: false

# A newer run for the same ref supersedes an older one, except for tags: two
# releases must not cancel each other's push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Same defaults as docker/images.just; the justfile and this workflow must
  # agree or a local build would not reproduce the published image.
  IMAGE: ghcr.io/langbeck/dsh

jobs:
  # Decides whether the images need rebuilding, so branch pushes that touch no
  # image input cost a few seconds instead of a full build. Tag pushes always
  # proceed: a release must publish what its commit contains, and the commit
  # may not touch docker/ at all. For a pull request the trigger's `paths`
  # filter has already done this work, so it proceeds too.
  changes:
    name: decide whether to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Only the changed paths are inspected, so history is not needed.
          fetch-depth: 2

      - name: Check for changes under docker/
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pushes report the range in the event payload. A force-push or a
          # brand-new branch reports an all-zero `before`, and a branch whose
          # only commit has no parent cannot be diffed against HEAD^, so both
          # fall back to the empty tree, which lists every file as added.
          before='${{ github.event.before }}'
          empty_tree=$(git hash-object -t tree /dev/null)
          case "$before" in
            ''|*0000000000000000000000000000000000000000*) base="$empty_tree" ;;
            *) base="$before" ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$empty_tree"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(docker/|\.github/workflows/docker-build\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image inputs changed; skipping the build."
          fi

  build:
    name: build and push images
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN. Repository defaults are
      # read-only, so this must be explicit.
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The pins live in docker/versions.env; the Dockerfiles carry identical ARG
      # defaults for a bare `podman build`. Read them into the build-args below so
      # CI uses the same source of truth as `just docker::build` and the two
      # cannot drift. `set -a` exports every assignment, and blank/comment lines
      # are skipped rather than becoming `--build-arg =`.
      - name: Read pinned versions
        id: versions
        run: |
          set -a
          . docker/versions.env
          set +a
          args=""
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            args="$args$line"$'\n'
          done < docker/versions.env
          printf 'build-args=%s\n' "$args" >> "$GITHUB_OUTPUT"
          echo "Pinned versions from docker/versions.env:"
          echo "$args"

      # CI builds with buildx, not with `just docker::build`, so it cannot use
      # podman's --build-arg-file. It reads versions.env itself, and the
      # Dockerfiles carry ARG defaults as the contract for anything that cannot
      # pass build args. Fail early if the file and those defaults disagree:
      # otherwise editing versions.env would change local builds only.
      - name: Check the Dockerfile defaults match versions.env
        run: |
          status=0
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            name=${line%%=*}
            want=${line#*=}
            # Last ARG <name>=... across the Dockerfiles; that is the default a
            # build without --build-arg would use.
            got=$(grep -horE "^ARG ${name}=.*" docker/*.dockerfile \
                  | tail -n1 | cut -d= -f2-)
            if [ "$got" != "$want" ]; then
              echo "::error file=docker/versions.env::$name is '$want' here but '$got' in the Dockerfile ARG default"
              status=1
            else
              echo "ok: $name=$want"
            fi
          done < docker/versions.env
          exit $status

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> :v1.2.3, :1.2.3, :1.2, :latest. The semver patterns emit
      # nothing when the ref is not a release tag. `type=raw` is never gated by
      # the ref, so :latest needs an explicit `enable`; without it every main
      # and pull request build would be tagged.
      - name: Derive release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # The base image carries its own stable :base tag plus the release tags,
      # so it can be pinned like the Go image instead of only by mutable tag.
      - name: Build and push the base image
        id: base
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/base.dockerfile
          # amd64 only: golang.dockerfile downloads a TARGETARCH-specific Go
          # toolchain and installs gopls per-architecture, so a multi-arch
          # build needs an explicit platform proving pass first.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:base
            ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.versions.outputs.build-args }}
          # Always export the base to a local OCI layout so the Go build can
          # consume it as a named build context. This is what makes a build-only
          # run work: the base need not be published, and GHCR is never asked
          # for it. An OCI layout is used rather than `load: true` because the
          # docker-container driver keeps its own image store, so whether a
          # docker-image:// context can see a loaded image is not dependable.
          #
          # `push` is shorthand for `-o type=registry`, so it cannot be combined
          # with an `outputs` list -- one would silently replace the other and
          # :base would never reach GHCR. The registry exporter is therefore
          # listed alongside the oci exporter instead of using `push`.
          #
          # `tar=false` is required: the oci exporter's `tar` option defaults to
          # true, which writes a tarball AT the dest path rather than unpacking
          # an OCI layout there. An oci-layout:// context then fails with
          # `stat .../blobs/sha256/<digest>: not a directory`.
          outputs: |
            type=oci,dest=${{ runner.temp }}/base-oci,tar=false
            ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && 'type=registry' || '' }}
          labels: ${{ steps.meta.outputs.labels }}

      # Built on the base exported by the step above, passed as a named build
      # context rather than pulled from the registry. On a run that does not
      # push, :base does not exist in GHCR at all, and asking for it fails with
      # 403 from the token endpoint rather than a 404. The oci-layout context
      # needs no registry.
      - name: Build and push the Go image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/golang.dockerfile
          platforms: linux/amd64
          build-contexts: |
            base=oci-layout://${{ runner.temp }}/base-oci@${{ steps.base.outputs.digest }}
          build-args: |
            BASE_IMAGE=base
            ${{ steps.versions.outputs.build-args }}
          tags: |
            ${{ env.IMAGE }}:golang
            ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
          labels: ${{ steps.meta.outputs.labels }}
