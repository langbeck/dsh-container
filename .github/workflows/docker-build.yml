# Build the DSH sandbox images and publish them to the GitHub Container Registry
# as two repositories:
#   ghcr.io/langbeck/dsh         the base image, no language toolchain
#   ghcr.io/langbeck/dsh-golang  the base plus the Go toolchain and gopls
#
#   push to main     -> build and push :latest for both images
#   push tag v1.2.3  -> build and push :v1.2.3, :1.2.3, :1.2 and :latest
#   push to a branch -> build only, no push, and only when docker/ or this file
#                       changed
#   pull request     -> build only, no push, and only when docker/ or this file
#                       changed
#   manual dispatch  -> build only unless the `publish` box is ticked, which is
#                       how a release is retried
#
# No repository secrets are needed: GHCR authenticates with the per-run
# GITHUB_TOKEN, which is scoped to this repository and expires with the job, so
# there is no long-lived credential to leak or rotate.
#
# Both images come from the single docker/Dockerfile, selected by --target.
# Because the golang stage is `FROM base` in the same file, the Go image is
# always built on the base from the same source revision, so the two cannot
# drift and neither has to be published before the other can be built.
#
# One-time setup after the first successful push of each: a new package is
# created private, and public images are what allow anonymous pulls. Flip it
# under https://github.com/users/langbeck/packages/container/dsh/settings and
# .../dsh-golang/settings -> "Change visibility" -> Public. This cannot be
# undone. If a package already exists but is not linked to this repository, the
# source label cannot repair that: add the repo under "Manage Actions access".

name: docker-build

on:
  push:
    # Any branch or release tag reaches the job, and the job then decides
    # whether to build. `paths` cannot be used here: under `push` it gates tag
    # pushes as well as branch pushes, and a release must build even when its
    # commit happens to touch no image input. The `tags` pattern still limits
    # which tags trigger at all; the gate below only decides whether a branch
    # push is worth building.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: ["**"]
  pull_request:
    # A pull request is only ever validating the images, so it can be filtered
    # here with no such conflict.
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      # Named `publish` rather than `push`: `push` shadows the on.push event name,
      # which made `... || inputs.push` read as if it were a boolean when it
      # evaluates to a string.
      publish:
        description: Push the built images to the GitHub Container Registry
        type: boolean
        default: false

# A newer run for the same ref supersedes an older one, except for tags: two
# releases must not cancel each other's push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Same defaults as docker/images.just; the justfile and this workflow must
  # agree or a local build would not reproduce the published images.
  DSH_IMAGE: ghcr.io/langbeck/dsh
  DSH_GOLANG_IMAGE: ghcr.io/langbeck/dsh-golang

jobs:
  # Decides whether the images need rebuilding, so branch pushes that touch no
  # image input cost a few seconds instead of a full build. Tag pushes always
  # proceed: a release must publish what its commit contains, and the commit
  # may not touch docker/ at all. For a pull request the trigger's `paths`
  # filter has already done this work, so it proceeds too.
  changes:
    name: decide whether to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Only the changed paths are inspected, so history is not needed.
          fetch-depth: 2

      - name: Check whether the images could have changed
        id: check
        run: |
          # main and release tags always build, because they publish. So does a
          # manual dispatch. Only a feature-branch push is worth inspecting.
          if [ "${{ github.event_name }}" != "push" ] \
             || [ "${{ github.ref }}" = "refs/heads/main" ] \
             || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pushes report the range in the event payload. A force-push or a
          # brand-new branch reports an all-zero `before`, and a branch whose
          # only commit has no parent cannot be diffed against HEAD^, so both
          # fall back to the empty tree, which lists every file as added.
          before='${{ github.event.before }}'
          empty_tree=$(git hash-object -t tree /dev/null)
          case "$before" in
            ''|*0000000000000000000000000000000000000000*) base="$empty_tree" ;;
            *) base="$before" ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$empty_tree"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(docker/|\.github/workflows/docker-build\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image inputs changed; skipping the build."
          fi

  build:
    name: build and push images
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN. Repository defaults are
      # read-only, so this must be explicit.
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The pins live in docker/versions.env; the Dockerfiles carry identical ARG
      # defaults for a bare `podman build`. Read them into the build-args below so
      # CI uses the same source of truth as `just docker::build` and the two
      # cannot drift. `set -a` exports every assignment, and blank/comment lines
      # are skipped rather than becoming `--build-arg =`.
      - name: Read pinned versions
        id: versions
        run: |
          set -a
          . docker/versions.env
          set +a
          args=""
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            args="$args$line"$'\n'
          done < docker/versions.env
          printf 'build-args=%s\n' "$args" >> "$GITHUB_OUTPUT"
          echo "Pinned versions from docker/versions.env:"
          echo "$args"

      # CI builds with buildx, not with `just docker::build`, so it cannot use
      # podman's --build-arg-file. It reads versions.env itself, and the
      # Dockerfiles carry ARG defaults as the contract for anything that cannot
      # pass build args. Fail early if the file and those defaults disagree:
      # otherwise editing versions.env would change local builds only.
      - name: Check the Dockerfile defaults match versions.env
        run: |
          status=0
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            name=${line%%=*}
            want=${line#*=}
            # Last ARG <name>=... across the Dockerfiles; that is the default a
            # build without --build-arg would use.
            got=$(grep -horE "^ARG ${name}=.*" docker/*.dockerfile \
                  | tail -n1 | cut -d= -f2-)
            if [ "$got" != "$want" ]; then
              echo "::error file=docker/versions.env::$name is '$want' here but '$got' in the Dockerfile ARG default"
              status=1
            else
              echo "ok: $name=$want"
            fi
          done < docker/versions.env
          exit $status

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Tags for both images. v1.2.3 -> :v1.2.3, :1.2.3, :1.2, :latest. The
      # semver patterns emit nothing when the ref is not a release tag, and
      # `type=raw` is not ref-filtered on its own, so :latest is gated to main
      # and to release tags: a plain push to main moves the mutable tag, and a
      # release adds the pinned ones. Pull requests produce no tags at all.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DSH_IMAGE }}
            ${{ env.DSH_GOLANG_IMAGE }}
          flavor: |
            latest=false
          # metadata-action derives org.opencontainers.image.source from the
          # github context, but only when that context is fully populated. State
          # it explicitly so the label GHCR uses to link these packages to the
          # repository is always present. Without it a first push creates an
          # unlinked package, and later pushes cannot retro-link it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      # One Dockerfile, two stages. Each image is a separate build with its own
      # --target, so the base is built twice when both run: once for itself and
      # once as the parent of the golang stage. That is the cost of keeping the
      # two in one file, and it is what makes them impossible to drift -- the
      # golang image is always the base produced by this same source revision,
      # with nothing published in between.
      #
      # amd64 only: the golang stage downloads a TARGETARCH-specific Go
      # toolchain and installs gopls per-architecture, so a multi-arch build
      # needs an explicit platform proving pass first.

      - name: Log in to the GitHub Container Registry
        # Only log in when something will actually be pushed: a branch that
        # produced no tags has nothing to send.
        if: steps.meta.outputs.tags != '' && (github.event_name == 'push' || inputs.publish == true)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the base image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          target: base
          platforms: linux/amd64
          build-args: ${{ steps.versions.outputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ steps.meta.outputs.tags != '' && (github.event_name == 'push' || inputs.publish == true) }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push the Go image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          target: golang
          platforms: linux/amd64
          build-args: ${{ steps.versions.outputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ steps.meta.outputs.tags != '' && (github.event_name == 'push' || inputs.publish == true) }}
          labels: ${{ steps.meta.outputs.labels }}
